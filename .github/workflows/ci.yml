name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore MouseGestureDesktop.slnx
      - name: Build
        run: dotnet build MouseGestureDesktop.slnx -c Release --no-restore
      - name: Test
        run: dotnet test MouseGestureDesktop.slnx -c Release --no-build --logger trx --results-directory TestResults
      - name: Package portable application
        run: ./scripts/package.ps1
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: MouseGestureDesktop-win-x64-portable
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download portable package
        uses: actions/download-artifact@v4
        with:
          name: MouseGestureDesktop-win-x64-portable
          path: artifacts
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$env:RELEASE_TAG" --json tagName
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:RELEASE_TAG" --verify-tag --generate-notes --title "$env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create release' }
          }
          gh release upload "$env:RELEASE_TAG" `
            artifacts/MouseGestureDesktop-win-x64-portable.zip `
            artifacts/MouseGestureDesktop-win-x64-portable.zip.sha256 --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Failed to upload release assets' }
