name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore MouseGestureDesktop.slnx
      - name: Build
        run: dotnet build MouseGestureDesktop.slnx -c Release --no-restore
      - name: Test
        run: dotnet test MouseGestureDesktop.slnx -c Release --no-build --logger trx --results-directory TestResults
      - name: Package portable application
        run: ./scripts/package.ps1
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: MouseGestureDesktop-win-x64-portable
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
